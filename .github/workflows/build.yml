name: Native Foundation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config xvfb libgtk-4-dev libvte-2.91-gtk4-dev libpcre2-dev

      - name: Validate repository governance
        run: python3 scripts/validate_repository.py

      - name: Configure
        run: meson setup build --fatal-meson-warnings

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: xvfb-run -a meson test -C build --print-errorlogs

      - name: Validate install layout
        run: |
          DESTDIR="$RUNNER_TEMP/install-root" meson install -C build
          test -x "$RUNNER_TEMP/install-root/usr/local/bin/goreecloud-terminal"
          test -f "$RUNNER_TEMP/install-root/usr/local/share/applications/com.goreecloud.Terminal.desktop"


  validate-debian-13:
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential meson ninja-build pkg-config xvfb libgtk-4-dev libvte-2.91-gtk4-dev libpcre2-dev

      - name: Record dependency versions
        run: |
          pkg-config --modversion gtk4
          pkg-config --modversion vte-2.91-gtk4
          pkg-config --modversion glib-2.0
          meson --version
          ninja --version

      - name: Validate repository governance
        run: python3 scripts/validate_repository.py

      - name: Configure
        run: meson setup build --fatal-meson-warnings

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: xvfb-run -a meson test -C build --print-errorlogs

      - name: Validate install layout
        run: |
          DESTDIR="$RUNNER_TEMP/install-root" meson install -C build
          test -x "$RUNNER_TEMP/install-root/usr/local/bin/goreecloud-terminal"
          test -f "$RUNNER_TEMP/install-root/usr/local/share/applications/com.goreecloud.Terminal.desktop"
