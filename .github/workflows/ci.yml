name: Linux Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux renderer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --all-targets
      - name: Static analysis
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile release configuration
        run: cargo build --release
