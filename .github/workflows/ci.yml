name: Linux Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux renderer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev pkg-config xvfb xauth x11-utils libgl1-mesa-dri
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Static analysis
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compile release configuration
        run: cargo build --locked --release
      - name: Verify actual native X11 window in isolated Xvfb
        run: bash scripts/smoke-linux.sh target/release/goreecloud-terminal
      - name: Compute preview checksum
        run: sha256sum target/release/goreecloud-terminal > target/release/goreecloud-terminal.sha256
      - name: Upload unsigned Linux preview for device testing
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-terminal-preview-linux-x86_64
          path: |
            target/release/goreecloud-terminal
            target/release/goreecloud-terminal.sha256
          if-no-files-found: error
          retention-days: 7
