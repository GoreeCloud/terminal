[package]
name = "goreecloud-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Linux-native, local-first GoreeCloud terminal emulator"
license = "GPL-3.0-only"
repository = "https://github.com/GoreeCloud/terminal"
readme = "README.md"
keywords = ["terminal", "linux", "pty", "slint"]

[dependencies]
anyhow = "1.0"
arboard = "=3.7.0"
portable-pty = "=0.9.0"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
vt100 = "=0.18.1"

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
